server {
    listen 80;
    server_name isp.hasalioma.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name isp.hasalioma.online;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # nginx's default (1M) is too small for a phone camera photo -- that's
    # what the raw "413 Request Entity Too Large" error was (rejected here,
    # before the request ever reached Django). Covers receipt/invoice
    # attachments and any other upload (site logo, etc).
    client_max_body_size 15M;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Everything the app needs (JS, CSS, the Plus Jakarta Sans font files) is
    # built into /usr/share/nginx/html and served from here -- nothing is
    # fetched from a CDN, so pages (and the hotspot portal behind the
    # walled garden) load without outside internet. Compress text assets;
    # fonts are already compressed (woff2), so they're left alone.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite puts a content hash in every built file name (index-D6Jh.js,
    # plus-jakarta-sans-...-Dhut76fR.woff2), so a changed file always gets a
    # new name: these can be cached for a year and never re-downloaded.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html is never cached, so a deploy is picked up on the next load
    # and it points at the new hashed files.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /django-admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/mediafiles/;
    }
}
