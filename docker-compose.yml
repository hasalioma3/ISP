name: isp-billing

services:
  backend:
    build: ./backend
    command: gunicorn isp_billing.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always
    ports:
      - "8000:8000"
    networks:
      - isp_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEFAULT_PORTAL_URL: ${CAPTIVE_PORTAL_URL:-https://isp.hasalioma.online/portal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: always
    networks:
      - isp_network

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    restart: always
    networks:
      - isp_network
      # Also reachable from other companies' stacks (see
      # docker-compose.company.yml) -- one shared Postgres server, one
      # database per company, instead of a Postgres container per company.
      - isp_shared_network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - isp_network
      - isp_shared_network

  celery_worker:
    build: ./backend
    command: celery -A isp_billing worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/mediafiles
    env_file:
      - .env.prod
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

  celery_beat:
    build: ./backend
    command: celery -A isp_billing beat -l info
    env_file:
      - .env.prod
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

networks:
  isp_network:
    driver: bridge
  isp_shared_network:
    name: isp_shared_network

volumes:
  postgres_data:
    external: true
    name: isp_postgres_data
  static_volume:
    external: true
    name: isp_static_volume
  media_volume:
    external: true
    name: isp_media_volume
