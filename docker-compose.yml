name: isp-billing

services:
  backend:
    build: ./backend
    command: gunicorn isp_billing.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always
    ports:
      - "8000:8000"
    networks:
      - isp_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEFAULT_PORTAL_URL: ${CAPTIVE_PORTAL_URL:-https://isp.hasalioma.online/portal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: always
    networks:
      - isp_network

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    restart: always
    networks:
      - isp_network
      # Also reachable from other companies' stacks (see
      # docker-compose.company.yml) -- one shared Postgres server, one
      # database per company, instead of a Postgres container per company.
      - isp_shared_network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - isp_network
      - isp_shared_network

  celery_worker:
    build: ./backend
    command: celery -A isp_billing worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/mediafiles
    env_file:
      - .env.prod
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

  celery_beat:
    build: ./backend
    command: celery -A isp_billing beat -l info
    env_file:
      - .env.prod
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

  whatsapp_service:
    build: ./whatsapp-service
    volumes:
      - whatsapp_session:/app/auth
    restart: always
    networks:
      - isp_network
    # No `ports:` -- internal only, reached by backend/celery as
    # http://whatsapp_service:3000. Never publish this; Django proxies
    # status/QR to the browser through an authenticated endpoint.

  # --- TR-069 (GenieACS) -- remote management of customer CPE routers ---
  # One image (genieacs-service/Dockerfile, installs the official `genieacs`
  # npm package), run as three independent services via different
  # `command:` overrides -- same "build once, run with different commands"
  # pattern already used above for backend/celery_worker/celery_beat.
  genieacs_mongo:
    image: mongo:6
    volumes:
      - genieacs_mongo_data:/data/db
    restart: always
    networks:
      - isp_network
    # No `ports:` -- internal only, reached by the three genieacs_* services
    # as mongodb://genieacs_mongo/genieacs.

  genieacs_cwmp:
    build: ./genieacs-service
    command: genieacs-cwmp
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs_mongo/genieacs
    depends_on:
      - genieacs_mongo
    restart: always
    ports:
      # MUST be reachable from the public internet -- this is the endpoint
      # customer CPE devices phone home to. Forward 7547 on the same public
      # domain/port-forward already used for the M-Pesa callback.
      - "7547:7547"
    networks:
      - isp_network

  genieacs_nbi:
    build: ./genieacs-service
    command: genieacs-nbi
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs_mongo/genieacs
    depends_on:
      - genieacs_mongo
    restart: always
    networks:
      - isp_network
    # No `ports:` -- internal only (unauthenticated admin API), reached by
    # backend/celery as http://genieacs_nbi:7557. Never publish this --
    # same network-isolation-as-access-control pattern as whatsapp_service.

  genieacs_fs:
    build: ./genieacs-service
    command: genieacs-fs
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs_mongo/genieacs
    # GENIEACS_FS_URL_PREFIX (the public URL CPE devices use to fetch
    # pushed firmware/config files -- must match wherever port 7567 is
    # actually forwarded to) comes from .env.prod, same as every other
    # environment-specific value in this stack -- set it there rather than
    # hardcoding a domain here.
    env_file:
      - .env.prod
    depends_on:
      - genieacs_mongo
    restart: always
    ports:
      # MUST be reachable from the public internet -- CPE devices fetch
      # firmware/config downloads from here. Forward 7567 alongside 7547.
      - "7567:7567"
    networks:
      - isp_network

networks:
  isp_network:
    driver: bridge
  isp_shared_network:
    name: isp_shared_network

volumes:
  postgres_data:
    external: true
    name: isp_postgres_data
  static_volume:
    external: true
    name: isp_static_volume
  media_volume:
    external: true
    name: isp_media_volume
  whatsapp_session:
    external: true
    name: isp_whatsapp_session
  genieacs_mongo_data:
    external: true
    name: isp_genieacs_mongo_data
