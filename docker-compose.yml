name: ${ISP_COMPOSE_NAME:-isp-billing}

services:
  backend:
    build: ./backend
    command: gunicorn isp_billing.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - ${ISP_ENV_FILE:-.env.prod}
    environment:
      CELERY_BROKER_URL: ${ISP_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${ISP_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
    restart: always
    ports:
      - "${ISP_BACKEND_PORT:-8000}:8000"
    networks:
      - isp_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEFAULT_PORTAL_URL: ${CAPTIVE_PORTAL_URL:-https://isp.hasalioma.online/portal}
    ports:
      - "${ISP_HTTP_PORT:-80}:80"
      - "${ISP_HTTPS_PORT:-443}:443"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: always
    networks:
      - isp_network

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ${ISP_ENV_FILE:-.env.prod}
    restart: always
    networks:
      - isp_network
      # Also reachable from other companies' stacks (see
      # docker-compose.company.yml) -- one shared Postgres server, one
      # database per company, instead of a Postgres container per company.
      - isp_shared_network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - isp_network
      - isp_shared_network

  celery_worker:
    build: ./backend
    command: celery -A isp_billing worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/mediafiles
    env_file:
      - ${ISP_ENV_FILE:-.env.prod}
    environment:
      CELERY_BROKER_URL: ${ISP_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${ISP_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

  celery_beat:
    build: ./backend
    command: celery -A isp_billing beat -l info
    env_file:
      - ${ISP_ENV_FILE:-.env.prod}
    environment:
      CELERY_BROKER_URL: ${ISP_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${ISP_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - isp_network

  whatsapp_service:
    build: ./whatsapp-service
    volumes:
      - whatsapp_session:/app/auth
    restart: always
    networks:
      - isp_network
    # No `ports:` -- internal only, reached by backend/celery as
    # http://whatsapp_service:3000. Never publish this; Django proxies
    # status/QR to the browser through an authenticated endpoint.

networks:
  isp_network:
    driver: bridge
  isp_shared_network:
    name: ${ISP_SHARED_NETWORK:-isp_shared_network}

volumes:
  postgres_data:
    external: true
    name: ${ISP_POSTGRES_VOLUME:-isp_postgres_data}
  static_volume:
    external: true
    name: ${ISP_STATIC_VOLUME:-isp_static_volume}
  media_volume:
    external: true
    name: ${ISP_MEDIA_VOLUME:-isp_media_volume}
  whatsapp_session:
    external: true
    name: ${ISP_WHATSAPP_VOLUME:-isp_whatsapp_session}
